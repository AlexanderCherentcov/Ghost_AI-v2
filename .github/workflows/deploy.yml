name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'bot/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          # 178.253.55.232 снаружи больше не отвечает по SSH (проверено с узлов в США/Германии
          # 2026-09-20, деплой падал с "dial tcp ... i/o timeout") — сервер тот же, адрес новый.
          host: 45.146.131.100
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/ghostline_v2

            # Изменённые сервисы считаем ОТ РЕАЛЬНО ЗАДЕПЛОЕННОГО коммита (текущий
            # HEAD сервера ДО reset), а не HEAD~1 — раньше при пуше нескольких
            # коммитов разом (`git push` после пары `git commit`) HEAD~1 сравнивал
            # только последний коммит с его непосредственным родителем, и изменения
            # из более ранних коммитов того же пуша молча терялись — например правка
            # backend/ в первом коммите не пересобиралась, если второй коммит того
            # же пуша трогал только frontend/ (см. inc. c38121c, разбор 2026-08-29).
            OLD_SHA=$(git rev-parse HEAD)

            # Fix any broken remote refs, then hard-reset to latest master
            git remote prune origin
            git fetch origin master
            git reset --hard origin/master
            NEW_SHA=$(git rev-parse HEAD)

            CHANGED=$(git diff --name-only "$OLD_SHA" "$NEW_SHA")
            echo "Changed files ($OLD_SHA -> $NEW_SHA):"
            echo "$CHANGED"
            DEPLOY_BACKEND=$(echo "$CHANGED" | grep -q '^backend/' && echo true || echo false)
            DEPLOY_FRONTEND=$(echo "$CHANGED" | grep -q '^frontend/' && echo true || echo false)
            DEPLOY_BOT=$(echo "$CHANGED" | grep -q '^bot/' && echo true || echo false)
            # infra/nginx/*.conf монтируется в контейнер read-only volume'ом —
            # git reset --hard обновляет файл на диске, но РАБОТАЮЩИЙ процесс nginx
            # продолжает жить со старым конфигом в памяти, пока его не перезагрузить.
            # Раньше этот случай был вообще не покрыт: воркфлоу триггерится на
            # infra/** (см. `on: push: paths:` выше), но скрипт ничего не делал с
            # nginx — правки конфига реально применялись только со следующим
            # ручным перезапуском контейнера.
            DEPLOY_NGINX=$(echo "$CHANGED" | grep -q '^infra/nginx/' && echo true || echo false)
            echo "Changed services — backend: $DEPLOY_BACKEND, frontend: $DEPLOY_FRONTEND, bot: $DEPLOY_BOT, nginx: $DEPLOY_NGINX"

            cd infra

            if [ "$DEPLOY_BACKEND" = "true" ]; then
              echo "→ Rebuilding backend..."
              docker compose build --no-cache backend
              docker compose up -d --no-deps backend
              echo "→ Backend deployed"
            fi

            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              echo "→ Rebuilding frontend..."
              docker compose build --no-cache frontend
              docker compose up -d --no-deps frontend
              echo "→ Frontend deployed"
            fi

            if [ "$DEPLOY_BOT" = "true" ]; then
              echo "→ Rebuilding bot + admin-bot + support-bot..."
              docker compose build --no-cache bot admin-bot support-bot
              docker compose up -d --no-deps bot admin-bot support-bot
              echo "→ Bot deployed"
            fi

            if [ "$DEPLOY_NGINX" = "true" ]; then
              echo "→ Recreating nginx (config changed)..."
              # НЕ `docker compose exec nginx nginx -s reload` — bind-mount на
              # ОДИН файл привязывается к inode на момент старта контейнера, а
              # `git reset --hard` пересоздаёт файл (unlink+create), а не правит
              # на месте. Reload перечитывает старый (уже отвязанный) inode —
              # живая проверка 2026-09-11: конфиг на диске обновился, md5sum
              # внутри контейнера остался старым, nginx продолжал работать со
              # старыми directives. Полный recreate переустанавливает bind mount.
              docker compose stop nginx
              docker compose up -d nginx
              echo "→ Nginx recreated"
            fi

            # Сборки идут с --no-cache, поэтому кэш сборки ни разу не переиспользуется, но за
            # каждый деплой копится сотнями МБ (накопилось 16 ГБ и диск дошёл до 81%).
            # Чистим его целиком после каждого деплоя; висящие образы — тоже. Плюс страховка:
            # раз в неделю то же делает /etc/cron.d/docker-cleanup на сервере.
            docker builder prune -af
            docker image prune -f
            echo "✅ Deploy done: $(date)"
