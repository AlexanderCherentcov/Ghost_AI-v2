name: Switch Telegram proxy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-proxy.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test providers and the 2082 router
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.15.179.195
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "=== direct providers ==="
            for url in https://openrouter.ai/api/v1/models https://api.openai.com/v1/models https://api.telegram.org; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 15 "$url")
              echo "$code $url"
            done
            echo "=== via proxy ==="
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 12 -x http://45.130.254.76:8888 https://openrouter.ai/api/v1/models)
            echo "$code via_proxy openrouter"
            echo "=== stream map ==="
            nginx -T 2>/dev/null | awk 'BEGIN{p=0} /stream \{/{p=1} p{print} /^}/{if(p){exit}}' | sed -E 's#(ssl_certificate_key|ssl_certificate)[[:space:]].*#\1 REDACTED#'
            echo "=== timeweb files ==="
            grep -RIl --binary-files=without-match -e timeweb -e TIMEWEB /root /opt /etc --exclude-dir=venv --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null | head -20
            echo "=== bot proxy errors ==="
            docker logs --tail 15 infra-bot-1 2>&1 | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]{20,}/TOKEN/g' | cut -c1-180
            echo DONE
