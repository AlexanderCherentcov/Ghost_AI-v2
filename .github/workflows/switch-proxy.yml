name: Switch Telegram proxy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-proxy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: See why today's new-user alerts did not arrive
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.146.131.100
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            bash -s << 'REMOTE'
            set -euo pipefail
            cd /root/ghostline_v2/infra
            echo "--- container ---"
            docker compose ps backend --format '{{.Name}} {{.Status}}'
            cid=$(docker compose ps -q backend)
            docker inspect -f 'started={{.State.StartedAt}} image={{.Config.Image}}' "$cid"
            echo "--- telegram log lines ---"
            docker logs --since 2026-11-20T19:00:00Z "$cid" 2>&1 | grep -E 'AdminNotify|Bot API via proxy|Telegram API' | sed -E 's/bot[0-9]+:[A-Za-z0-9_-]+/bot***/g' | tail -n 80
            echo "--- log count ---"
            docker logs --since 2026-11-20T19:00:00Z "$cid" 2>&1 | grep -c 'AdminNotify' || true
            echo "--- users created since 21 Nov 00:00 YEKT ---"
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_char(\"createdAt\" AT TIME ZONE 'Asia/Yekaterinburg', 'YYYY-MM-DD HH24:MI') AS created_yekt, plan, (\"telegramId\" IS NOT NULL) AS has_tg, (email IS NOT NULL) AS has_mail FROM \"User\" WHERE \"createdAt\" >= '2026-11-20 19:00:00+00' ORDER BY \"createdAt\";"
            REMOTE
