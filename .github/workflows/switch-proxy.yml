name: Switch Telegram proxy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-proxy.yml'

jobs:
  findip:
    runs-on: ubuntu-latest
    steps:
      - name: Probe both Aeza addresses from GitHub
        run: |
          set +e
          for ip in 45.146.131.100 45.146.131.168; do
            echo "===== $ip ====="
            curl -sv --connect-timeout 6 --max-time 10 "http://$ip/" -o /tmp/body 2>&1 | tail -20
            echo "--- https sni ---"
            curl -skI --connect-timeout 6 --max-time 10 --resolve ghostlineai.ru:443:$ip https://ghostlineai.ru/ | head -12
          done
      - name: SSH old address
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.146.131.100
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: |
            echo OLD_OK
            hostname
            curl -4 -s --max-time 8 https://ifconfig.me || true
            echo
            ip -4 -br addr
      - name: SSH likely new address
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.146.131.168
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 1m
          script: |
            echo NEW_OK
            hostname
            curl -4 -s --max-time 8 https://ifconfig.me || true
            echo
            ip -4 -br addr
