name: Switch Telegram proxy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-proxy.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect leftovers on the new IP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.15.179.195
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "=== proxy tcp ==="
            timeout 6 bash -c 'echo >/dev/tcp/45.130.254.76/8888' && echo proxy_8888_open || echo proxy_8888_fail
            timeout 6 bash -c 'echo >/dev/tcp/45.130.254.76/22' && echo proxy_22_open || echo proxy_22_fail
            echo "=== listeners ==="
            ss -lntup | awk 'NR==1 || /:22|:80|:443|:2082|:2083|:54321|:8443|:2053/'
            echo "=== xui files ==="
            find /usr/local /etc /opt /root -name 'x-ui.db' -o -name 'xray' -o -name 'config.json' 2>/dev/null | head -40
            echo "=== old ip outside repo ==="
            grep -RIl --binary-files=without-match '45.146.131.100' /etc /usr/local /opt /root/nginx.conf.bak-20260903-prel2 2>/dev/null | head -40
            echo "=== env key names mentioning dns or timeweb ==="
            awk -F= '/timeweb|TIMEWEB|DNS_|CLOUDFLARE|CF_API/ {print FILENAME, $1}' /root/ghostline_v2/infra/.env /root/.env /root/ghostline_v2/.env 2>/dev/null
            echo "=== ssh to proxy ==="
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new root@45.130.254.76 'hostname; echo PROXY_LOGIN_OK' 2>&1 | head -5
            echo DONE
