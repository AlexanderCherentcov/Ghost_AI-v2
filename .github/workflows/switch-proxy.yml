name: Switch Telegram proxy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-proxy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test Telegram message through the current proxy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.146.131.100
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            bash -s << 'REMOTE'
            set -euo pipefail
            python3 - << 'PY'
            import json, re, subprocess
            from pathlib import Path

            env = {}
            for raw in Path("/root/ghostline_v2/infra/.env").read_text().splitlines():
                line = raw.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                env[key.strip()] = value.strip().strip('"').strip("'")

            proxy = env.get("HTTPS_PROXY") or env.get("HTTP_PROXY") or ""
            token = env.get("ADMIN_BOT_TOKEN") or env.get("TELEGRAM_BOT_TOKEN") or ""
            admins = [a.strip() for a in env.get("ADMIN_IDS", "").split(",") if a.strip()]
            host = re.sub(r"^https?://([^@/]+@)?", "", proxy).split("/")[0]
            print(f"proxy_host={host or 'MISSING'} admins={len(admins)} token={'yes' if token else 'no'}")
            if not proxy or not token or not admins:
                raise SystemExit("missing proxy, token or admin id")

            text = "Тест GhostLine: сообщение ушло с боевого сервера через текущий прокси. Адрес прокси не менял."
            for chat in admins:
                proc = subprocess.run(
                    ["curl", "-4", "-sS", "--connect-timeout", "12", "--max-time", "25",
                     "-x", proxy, "-H", "Content-Type: application/json",
                     "-d", json.dumps({"chat_id": chat, "text": text, "disable_web_page_preview": True}),
                     "-w", "\n%{http_code}",
                     f"https://api.telegram.org/bot{token}/sendMessage"],
                    capture_output=True, text=True,
                )
                err = re.sub(r"bot\d+:[A-Za-z0-9_-]+", "bot***", proc.stderr or "")
                err = re.sub(r"://[^@\s/]+:[^@\s/]+@", "://***@", err)
                body, _, code = (proc.stdout or "").rpartition("\n")
                try:
                    data = json.loads(body)
                except json.JSONDecodeError:
                    data = {}
                desc = str(data.get("description") or "")[:160]
                msg = (data.get("result") or {}).get("message_id")
                print(f"chat={chat} http={code.strip()} ok={data.get('ok')} message_id={msg} desc={desc} err={err.strip()[:180]}")
                if not data.get("ok"):
                    raise SystemExit("telegram did not accept the message")
            print("sent")
            PY
            REMOTE
