name: Switch Telegram proxy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/switch-proxy.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Look for another login without guessing passwords
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 45.146.131.100
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            bash -s << 'REMOTE'
            set -euo pipefail
            echo "--- root names ---"
            find /root -maxdepth 2 -type f -o -type d | sed 's#^/root#/root#' | head -80
            echo "--- pub ---"
            awk '{print $1, $3}' /root/.ssh/id_ed25519.pub /root/.ssh/github_deploy.pub
            echo "--- users ---"
            python3 - << 'PY'
            import subprocess
            from pathlib import Path
            users = ["root", "ubuntu", "admin", "debian"]
            keys = [p for p in ["/root/.ssh/id_ed25519", "/root/.ssh/github_deploy"] if Path(p).is_file()]
            host = "178.236.251.155"
            for user in users:
                for key in keys:
                    proc = subprocess.run(
                        ["ssh", "-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=accept-new", "-o", "ConnectTimeout=8", "-i", key, f"{user}@{host}", "hostname"],
                        capture_output=True, text=True, timeout=15,
                    )
                    err = (proc.stderr or "").strip().splitlines()
                    print(f"{user} {Path(key).name} rc={proc.returncode} out={(proc.stdout or '').strip()[:40]!r} err={(err[-1][:120] if err else '')}")
            PY
            REMOTE
