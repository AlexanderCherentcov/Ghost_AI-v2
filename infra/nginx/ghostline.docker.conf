# ══════════════════════════════════════════════════════════════════════════════
#  Nginx — GhostLine Docker Config
#  Отличие от ghostline.conf: proxy_pass использует Docker-имена сервисов,
#  а не 127.0.0.1. SSL-сертификаты монтируются через volume certbot.
# ══════════════════════════════════════════════════════════════════════════════

# NOTE: nginx-level rate limiting не используется: пока перед docker-nginx стоял системный
# stream-роутер на 443, все посетители приходили с адреса 172.18.0.1 и делили бы один бакет.
# Лимиты — в backend (@fastify/rate-limit): по userId авторизованных, для анонимов — общий
# потолок (см. backend/src/lib/rate-limit-key.ts).

# Микро-кэш публичных GET'ов API (одинаковы для всех, дёргаются при каждой загрузке страницы):
# при всплеске рекламного трафика backend получает ~1 запрос в 20 с вместо сотен.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_public:10m max_size=50m inactive=10m use_temp_path=off;

# ─── HTTP → HTTPS redirect + ACME challenge ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ghostlineai.ru www.ghostlineai.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ghostlineai.ru$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ghostlineai.ru;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Backend API + WebSocket ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ghostlineai.ru;

    ssl_certificate     /etc/letsencrypt/live/api.ghostlineai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ghostlineai.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Docker's internal DNS — re-resolves service IPs after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Публичные данные: тарифы/модели, флаг техработ, витрина галереи. Ключ кэша включает
    # Authorization — у залогиненных в витрине свой likedByMe, чужие ответы им не отдаются.
    # proxy_cache_lock — параллельные промахи схлопываются в один запрос к backend.
    location ~ ^/api/(plans|maintenance|gallery/featured)$ {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_cache        api_public;
        proxy_cache_key    "$scheme$host$request_uri$http_authorization";
        proxy_cache_valid  200 20s;
        proxy_cache_lock   on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header         X-Cache-Status $upstream_cache_status always;
        add_header         Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Generated images — served by backend from uploads/images/
    location /images/ {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Generated videos — served by backend from uploads/videos/ with Range support
    location /videos/ {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Range $http_range;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Gallery media (копии картинок/видео из GalleryItem) — served by backend from uploads/gallery/
    location /gallery-media/ {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Range $http_range;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Generated audio — served by backend from uploads/audio/
    location /audio/ {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 120s;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location /api/chat/stream {
        set $backend_upstream http://backend:4000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
    }
}

# NOTE: app.ghostlineai.ru (Telegram Mini App) is served via Cloudflare Pages.
# The miniapp Docker service runs internally only.
# To expose via nginx, provision a cert first:
#   docker compose stop nginx
#   docker run --rm -p 80:80 -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot:latest \
#     certonly --standalone --non-interactive --agree-tos \
#     --email admin@ghostlineai.ru -d app.ghostlineai.ru
#   docker compose restart nginx

# ─── Frontend (основной сайт) ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghostlineai.ru www.ghostlineai.ru;

    ssl_certificate     /etc/letsencrypt/live/ghostlineai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostlineai.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Docker's internal DNS — re-resolves service IPs after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # www → non-www
    if ($host = www.ghostlineai.ru) {
        return 301 https://ghostlineai.ru$request_uri;
    }

    # JS/CSS chunks have content-hash in filename — cache aggressively.
    # proxy_hide_header — Next.js сам ставит свой Cache-Control на эти ответы;
    # без hide add_header ДОБАВЛЯЕТ значение поверх, а не заменяет — клиент
    # получает два конфликтующих Cache-Control одновременно.
    location /_next/static/ {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header в location ПЕРЕКРЫВАЕТ унаследованные с уровня server — заголовки безопасности
        # приходится повторять в каждом location, иначе на ответах их не будет (проверено curl'ом).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML pages — never cache (always fresh). Same proxy_hide_header reason as
    # above — подтверждено вживую: /  и /chat отдавали одновременно
    # "s-maxage=31536000" (от Next.js, для ISR/static-страниц) и
    # "no-store, no-cache, must-revalidate" (от nginx).
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header  Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # См. комментарий в /_next/static/: без повтора здесь HTML отдавался без HSTS и прочих заголовков.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
